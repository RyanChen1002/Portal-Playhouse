<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portal Playhouse is a shared world for small adventures with friends.">
  <title>Portal Playhouse</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #214239;
      background: #f7f5ee;
      font-family: system-ui, sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }
    .scene {
      display: grid;
      place-items: center;
      min-height: 20rem;
      background: radial-gradient(ellipse at 45% 30%, #edf2df, #c4d5ba);
      overflow: hidden;
    }
    .island {
      position: relative;
      width: min(68%, 24rem);
      aspect-ratio: 2 / 1;
      border-radius: 50%;
      background: #afc18f;
      box-shadow: 0 1.15rem 0 #81976e, 0 2.4rem 3rem #3e624340;
      transform: rotate(-12deg);
    }
    .portal {
      position: absolute;
      bottom: 30%;
      left: 39%;
      width: 28%;
      height: 105%;
      border: clamp(.55rem, 1.6vw, 1.1rem) solid #60835e;
      border-radius: 6rem 6rem .65rem .65rem;
      background: linear-gradient(145deg, #edf4c3, #aac48c);
      box-shadow: .55rem .3rem 0 #47694c, inset 0 0 1.4rem #f5ffdd;
      transform: rotate(12deg);
    }
    .copy {
      align-self: center;
      padding: clamp(2rem, 8vw, 7rem);
    }
    .brand {
      margin: 0 0 2rem;
      font-size: .8rem;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font: 400 clamp(2.7rem, 5vw, 5rem)/1 Georgia, serif;
      letter-spacing: -.045em;
      max-width: 12ch;
    }
    .intro {
      margin: 1.4rem 0 2rem;
      max-width: 31ch;
      line-height: 1.6;
    }
    .status {
      display: inline-block;
      margin: 0;
      padding: .6rem .9rem;
      border: 1px solid #b7c5ad;
      border-radius: 2rem;
      background: #e8eddf;
      font-size: .9rem;
    }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; }
      .copy { padding: 2rem 1.5rem 3rem; }
    }
  </style>
</head>
<body>
  <main>
    <div class="scene" aria-hidden="true">
      <div class="island"><div class="portal"></div></div>
    </div>
    <section class="copy" aria-labelledby="welcome-title">
      <p class="brand">✦ Portal Playhouse</p>
      <h1 id="welcome-title">Welcome to the playhouse.</h1>
      <p class="intro">A little world for small adventures with friends.</p>
      <p class="status">Coming soon</p>
    </section>
  </main>
</body>
</html>
